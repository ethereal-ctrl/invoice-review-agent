name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Abhängigkeiten
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typen
        run: uv run pyright

      - name: Postgres starten
        run: docker compose up -d --wait

      - name: Tests
        run: uv run pytest

      - name: Daten erzeugen (deterministisch)
        run: |
          uv run invoice generate
          uv run invoice angriffe-erzeugen

      - name: "Gate: Angriffe gegen Stufe 1 (keine automatische Freigabe)"
        run: uv run invoice angriffe --stufe regeln

      - name: "Gate: Smoke Set Stufe 1"
        run: uv run invoice eval --stufe regeln --split smoke --max-unsicher 0
