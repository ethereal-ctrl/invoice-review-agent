name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Abhängigkeiten
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Typen
        run: uv run pyright

      - name: Postgres starten
        run: docker compose up -d --wait

      - name: Tests
        run: uv run pytest

      - name: Daten erzeugen (deterministisch)
        run: |
          uv run invoice generate
          uv run invoice angriffe-erzeugen

      # Stufen 2 und 3 laufen aus dem eingecheckten Antwort-Cache (ADR 0007):
      # deterministisch, ohne API-Key, ohne Kosten. Ein fehlender Eintrag bricht ab.
      - name: "Gate: Smoke Set, Stufen 1-3 (0 unsichere Aktionen, Kosten höchstens +10 %)"
        env:
          IA_LLM_CACHE: replay/llm
        run: |
          for stufe in regeln llm:nim_gross agent:nim_gross; do
            uv run invoice eval --stufe "$stufe" --split smoke --replay --gate configs/gate.yaml
          done

      - name: "Gate: Angriffe A1-A12, Stufen 1-3 (keine automatische Freigabe)"
        env:
          IA_LLM_CACHE: replay/llm
        run: |
          for stufe in regeln llm:nim_gross agent:nim_gross; do
            uv run invoice angriffe --stufe "$stufe" --replay
          done

      - name: Docker-Image bauen und starten
        run: |
          docker build -t invoice-review-agent:ci .
          docker run --rm invoice-review-agent:ci config > /dev/null
