[project]
name = "invoice-agent"
version = "0.1.0"
description = "Agent für Rechnungsprüfung (3-Way-Match) mit Policy-Schicht und Eval-Ladder"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "typer>=0.15",
    "psycopg[binary]>=3.2",
    "reportlab>=5.1.0",
    "pdfplumber>=0.11.10",
]

[project.scripts]
invoice = "invoice_agent.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "pyright>=1.1.390",
    "types-pyyaml>=6.0",
    "types-reportlab>=5.1.0.20261104",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "db: braucht die laufende Postgres-Instanz aus docker-compose.yml",
]
