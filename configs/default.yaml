# Werte gemäß docs/spezifikation.md. Änderungen nach dem Einfrieren des Generators = neue Version.

toleranzen:
  preis_prozent: "2.0"      # R12: zulässige Überschreitung des Bestellpreises
  betrag_eur: "0.01"        # R7, R8, R10: Rundungstoleranz
  duplikat_tage: 30         # R6 (c): Zeitfenster für Doppelrechnungen

policy:
  freigabegrenze_eur: "5000.00"  # R15: kumuliert pro Bestellung, brutto
  fenster_tage: 30               # R15: Zeitfenster für die Kumulierung

kosten:                     # Pauschalen der Kostenmatrix in EUR (Begründung: ADR 0006)
  zurueckhalten_statt_freigeben: "15.00"   # Nacharbeit, verlorenes Skonto, Lieferantenbeziehung
  eskalieren_unnoetig: "5.00"              # ~5 Minuten Sachbearbeitung
  zurueckhalten_statt_eskalieren: "10.00"  # gestoppt, aber falsch begründet
  fehlerquote_real: "0.05"                 # Umrechnung auf eine realistische Fehlerquote
  bootstrap_wiederholungen: 2000
  bootstrap_seed: 7

generator:
  seed: 20261119
  anzahl: 300
  dev: 100
  test: 200
  smoke: 30                 # geschichtete Teilmenge von dev

llm:
  worker: 4                 # parallele Anfragen; der Rate Limiter pro Profil begrenzt zusätzlich
  cache_dir: cache/llm      # Antwort-Cache, getrennt nach Provider
  profile:
    # Ein Profil = ein Provider + ein Modell. Ein Lauf nutzt genau ein Profil, nie gemischt.
    # Modell-IDs der Cloud-Provider vor dem ersten Lauf prüfen (Modellliste des Providers).
    lokal_4b:
      provider: ollama
      basis_url: http://localhost:11434/v1
      modell: qwen3.5:4b
      rpm: 600
      timeout_s: 300
      extra_body:
        reasoning_effort: none   # Qwen 3.5 denkt sonst minutenlang vor der Antwort
    nim_gross:
      provider: nvidia
      basis_url: https://integrate.api.nvidia.com/v1
      modell: google/gemma-4-31b-it    # bitte prüfen
      key_env: NVIDIA_API_KEY
      rpm: 35
    gemini_gross:
      provider: gemini
      basis_url: https://generativelanguage.googleapis.com/v1beta/openai
      modell: gemma-4-31b-it           # bitte prüfen
      key_env: GEMINI_API_KEY
      rpm: 15
