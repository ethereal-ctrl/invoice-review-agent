services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ia_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ia_owner_dev}
      POSTGRES_DB: ${POSTGRES_DB:-invoice}
      IA_AGENT_PASSWORD: ${IA_AGENT_PASSWORD:-ia_agent_dev}
    ports:
      - "55432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
